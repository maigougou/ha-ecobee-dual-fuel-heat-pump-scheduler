# Generated by scripts/build_blueprint.py; edit the builder or src/ sources.
blueprint:
  name: ecobee Dual-Fuel Heat Pump Scheduler
  description: Schedule normal Heat (heat pump permitted with ecobee auxiliary backup) versus Auxiliary heat only.
    Keeps ecobee temperatures, Comfort Settings and sensor participation intact. Requires native ecobee integration
    and a dual-fuel installation. Runs only in Heat; optional Managed Auto integration handles Heat/Cool using this
    same schedule. Off and native Cool are left alone. Starts in observation mode. Disabling this automation leaves
    the last device settings in place. Cloud control is not an exact-time or offline guarantee. Version 0.2.0.
  source_url: https://github.com/maigougou/ha-ecobee-dual-fuel-heat-pump-scheduler/blob/main/blueprints/automation/ecobee_dual_fuel_scheduler.yaml
  domain: automation
  homeassistant:
    min_version: 2024.12.0
  input:
    equipment:
      name: 1 · Equipment
      description: Use the native ecobee integration. Both entities must belong to the same thermostat.
      input:
        thermostat:
          name: ecobee thermostat
          selector:
            entity:
              filter:
              - integration: ecobee
                domain: climate
        aux_switch:
          name: Auxiliary heat only switch
          description: Select Auxiliary heat only, NOT a ventilator or other switch. Aux must be your intended backup
            heat source.
          selector:
            entity:
              filter:
              - integration: ecobee
                domain: switch
        managed_auto_entity:
          name: Managed Auto controller (optional)
          default: ''
          description: Select the switch from the optional ecobee Managed Auto integration. It uses this schedule
            in Heat/Cool and pauses this Blueprint while controlling the same thermostat. Leave empty for Heat-only
            scheduling.
          selector:
            entity:
              filter:
              - domain: switch
                integration: ecobee_managed_auto
    schedule:
      name: 2 · Heat pump preferred window
      description: 'Within the window: normal Heat with native auxiliary backup. Outside: Auxiliary heat only. HA
        local time; weekdays name the start day.'
      input:
        start_time:
          name: Window begins
          default: '23:00:00'
          selector:
            time: {}
        end_time:
          name: Window ends
          default: 07:00:00
          selector:
            time: {}
        weekdays:
          name: Window start days
          default:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
          selector:
            select:
              multiple: true
              options:
              - label: Monday
                value: mon
              - label: Tuesday
                value: tue
              - label: Wednesday
                value: wed
              - label: Thursday
                value: thu
              - label: Friday
                value: fri
              - label: Saturday
                value: sat
              - label: Sunday
                value: sun
    protection:
      name: 3 · Optional compressor outdoor cutoff
      description: Normally leave this off and configure the thermostat's equipment protection directly. If enabled,
        verify your heat pump's approved operating limit first. This is a persistent setting, NOT restored when
        the automation stops.
      collapsed: true
      input:
        manage_cutoff:
          name: Manage compressor minimum outdoor temperature
          default: false
          selector:
            boolean: {}
        cutoff_entity:
          name: Compressor minimum temperature number (optional)
          default: ''
          description: Required only when management is enabled. Choose the ecobee Compressor minimum temperature
            number on the same device.
          selector:
            entity:
              filter:
              - integration: ecobee
                domain: number
                device_class: temperature
        cutoff_f:
          name: Compressor minimum outdoor temperature
          default: '15'
          description: Native ecobee increments are 5°F. Labels show °C too; conversion to your entity's unit is
            automatic. The default is a placeholder, not an equipment recommendation. Never choose below your equipment's
            approved limit.
          selector:
            select:
              options:
              - label: -25°F / -31.7°C
                value: '-25'
              - label: -20°F / -28.9°C
                value: '-20'
              - label: -15°F / -26.1°C
                value: '-15'
              - label: -10°F / -23.3°C
                value: '-10'
              - label: -5°F / -20.6°C
                value: '-5'
              - label: 0°F / -17.8°C
                value: '0'
              - label: 5°F / -15.0°C
                value: '5'
              - label: 10°F / -12.2°C
                value: '10'
              - label: 15°F / -9.4°C
                value: '15'
              - label: 20°F / -6.7°C
                value: '20'
              - label: 25°F / -3.9°C
                value: '25'
              - label: 30°F / -1.1°C
                value: '30'
              - label: 35°F / 1.7°C
                value: '35'
              - label: 40°F / 4.4°C
                value: '40'
              - label: 45°F / 7.2°C
                value: '45'
              - label: 50°F / 10.0°C
                value: '50'
              - label: 55°F / 12.8°C
                value: '55'
              - label: 60°F / 15.6°C
                value: '60'
              - label: 65°F / 18.3°C
                value: '65'
    operation:
      name: 4 · Operation and verification
      input:
        observation_mode:
          name: Observation mode (no equipment commands)
          default: true
          description: Start here. Run actions to see the proposed source in HA Notifications. Turn this off after
            checking the entities, schedule and thermostat protections.
          selector:
            boolean: {}
        acknowledgement_timeout:
          name: Readback timeout per command
          default: 240
          description: The cloud integration may take several minutes to refresh. A timeout does not prove a command
            failed; another attempt checks current state first.
          selector:
            number:
              min: 60
              max: 600
              step: 30
              unit_of_measurement: s
              mode: box
        max_attempts:
          name: Maximum attempts per command per run
          default: 2
          description: After a failed run, the next periodic check may try again. This is not a lifetime retry limit.
          selector:
            number:
              min: 1
              max: 3
              step: 1
              mode: box
        notify:
          name: Show observation and failure notifications
          default: true
          selector:
            boolean: {}
mode: single
max_exceeded: silent
triggers:
- trigger: time
  at: !input 'start_time'
- trigger: time
  at: !input 'end_time'
- trigger: time_pattern
  minutes: /5
- trigger: homeassistant
  event: start
- trigger: event
  event_type: automation_reloaded
variables:
  thermostat: !input 'thermostat'
  aux_switch: !input 'aux_switch'
  managed_auto_entity: !input 'managed_auto_entity'
  start_time: !input 'start_time'
  end_time: !input 'end_time'
  weekdays: !input 'weekdays'
  manage_cutoff: !input 'manage_cutoff'
  cutoff_entity: !input 'cutoff_entity'
  cutoff_f: !input 'cutoff_f'
  observation_mode: !input 'observation_mode'
  acknowledgement_timeout: !input 'acknowledgement_timeout'
  max_attempts: !input 'max_attempts'
  notify: !input 'notify'
  notification_id: '{{ ''ecobee_dual_fuel_'' ~ (this.entity_id | default(''manual'', true) | replace(''.'', ''_''))
    }}'
actions:
- variables:
    expected_policy: |
      {# Included at build time; the installed Blueprint has no external dependencies. #}
      {% macro policy() -%}
        {%- set t = states(thermostat) -%}
        {%- set a = states(aux_switch) -%}
        {%- set device = device_id(thermostat) -%}
        {%- set ecobee_entities = integration_entities('ecobee') -%}
        {%- set start = start_time.split(':') | map('int') | list -%}
        {%- set end = end_time.split(':') | map('int') | list -%}
        {%- set start_s = start[0] * 3600 + start[1] * 60 + (start[2] | default(0)) -%}
        {%- set end_s = end[0] * 3600 + end[1] * 60 + (end[2] | default(0)) -%}
        {%- set clock = now() -%}
        {%- set clock_s = clock.hour * 3600 + clock.minute * 60 + clock.second -%}
        {%- set names = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'] -%}
        {%- set today = clock.weekday() -%}
        {%- if not device or device_id(aux_switch) != device
            or thermostat not in ecobee_entities or aux_switch not in ecobee_entities -%}
          error:entities_must_share_one_native_ecobee_device
        {%- elif start_s == end_s or weekdays | length == 0
            or weekdays | reject('in', names) | list | length > 0 -%}
          error:invalid_schedule
        {%- elif t in ['unknown', 'unavailable'] or a not in ['on', 'off'] -%}
          error:required_entity_unavailable
        {%- elif managed_auto_entity and (states(managed_auto_entity) not in ['on', 'off']
            or state_attr(managed_auto_entity, 'thermostat') != thermostat
            or managed_auto_entity not in integration_entities('ecobee_managed_auto')) -%}
          error:auto_controller_unavailable_or_mismatched
        {%- elif managed_auto_entity and state_attr(managed_auto_entity, 'owns_mode') != false -%}
          skip:managed_auto_owns_mode
        {%- elif t != 'heat' -%}
          skip:not_in_heat_mode
        {%- elif manage_cutoff and cutoff_f | string not in
            ['-25', '-20', '-15', '-10', '-5', '0', '5', '10', '15', '20',
             '25', '30', '35', '40', '45', '50', '55', '60', '65'] -%}
          error:invalid_native_cutoff_step
        {%- elif manage_cutoff and (cutoff_entity not in ecobee_entities
            or device_id(cutoff_entity) != device
            or state_attr(cutoff_entity, 'device_class') != 'temperature'
            or state_attr(cutoff_entity, 'unit_of_measurement') not in ['°C', '°F']
            or not is_number(states(cutoff_entity))
            or not is_number(state_attr(cutoff_entity, 'min'))
            or not is_number(state_attr(cutoff_entity, 'max'))) -%}
          error:invalid_or_unavailable_cutoff_entity
        {%- elif manage_cutoff and (cutoff_value() | float < state_attr(cutoff_entity, 'min') | float
            or cutoff_value() | float > state_attr(cutoff_entity, 'max') | float) -%}
          error:cutoff_out_of_range
        {%- elif start_s < end_s -%}
          {{- 'heat' if start_s <= clock_s < end_s and names[today] in weekdays else 'aux' -}}
        {%- elif clock_s >= start_s -%}
          {{- 'heat' if names[today] in weekdays else 'aux' -}}
        {%- elif clock_s < end_s -%}
          {{- 'heat' if names[(today - 1) % 7] in weekdays else 'aux' -}}
        {%- else -%}
          aux
        {%- endif -%}
      {%- endmacro %}

      {% macro cutoff_value() -%}
        {{- (cutoff_f | float - 32) * 5 / 9
            if state_attr(cutoff_entity, 'unit_of_measurement') == '°C'
            else cutoff_f | float -}}
      {%- endmacro %}

      {% macro cutoff_matches() -%}
        {{- is_number(states(cutoff_entity))
            and (states(cutoff_entity) | float - cutoff_value() | float) | abs < 0.15 -}}
      {%- endmacro %}
      {{ policy() }}
- if:
  - condition: template
    value_template: '{{ expected_policy.startswith(''error:'') }}'
  then:
  - if:
    - condition: template
      value_template: '{{ notify }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: '{{ notification_id }}'
        title: ecobee Dual-Fuel Heat Pump Scheduler
        message: 'Configuration or availability check failed: {{ expected_policy }}. No equipment command was sent.
          Check that entities are available and belong to the same native ecobee device.'
  - stop: 'Configuration or availability check failed: {{ expected_policy }}. No equipment command was sent. Check
      that entities are available and belong to the same native ecobee device.'
- if:
  - condition: template
    value_template: '{{ expected_policy.startswith(''skip:'') }}'
  then:
  - action: persistent_notification.dismiss
    data:
      notification_id: '{{ notification_id }}'
  - stop: Thermostat is outside Heat scheduling or Managed Auto owns the mode. No equipment command was sent.
- if:
  - condition: template
    value_template: '{{ observation_mode }}'
  then:
  - if:
    - condition: template
      value_template: '{{ notify }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: '{{ notification_id }}'
        title: ecobee Dual-Fuel Heat Pump Scheduler
        message: 'Observation only: desired mode is {{ ''normal Heat (heat pump permitted, native Aux backup)''
          if expected_policy == ''heat'' else ''Auxiliary heat only'' }}. Current Aux switch: {{ states(aux_switch)
          }}. Compressor cutoff management: {{ ''enabled'' if manage_cutoff else ''disabled'' }}. {% if manage_cutoff
          %}Selected cutoff: {{ cutoff_f }}°F / {{ ((cutoff_f | float - 32) * 5 / 9) | round(1) }}°C; currently
          {{ states(cutoff_entity) }} {{ state_attr(cutoff_entity, ''unit_of_measurement'') }}. This cutoff is reconciled
          only during the heat-pump window. {% endif %}No equipment command was sent. Thermostat schedule and room
          temperatures are untouched.'
  - stop: 'Observation mode: no equipment commands.'
