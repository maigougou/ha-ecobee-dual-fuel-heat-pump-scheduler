name: Validate blueprint

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to catch HA beta changes before they ship.
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: Home Assistant ${{ matrix.home-assistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            home-assistant: "2024.12.0"
          - python: "3.14"
            home-assistant: "2026.10.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install minimum supported Home Assistant
        if: matrix.home-assistant == '2024.12.0'
        run: >-
          python -m pip install
          -c https://raw.githubusercontent.com/home-assistant/core/${{ matrix.home-assistant }}/homeassistant/package_constraints.txt
          "homeassistant==${{ matrix.home-assistant }}" "josepy<2"
      - name: Install current Home Assistant
        if: matrix.home-assistant != '2024.12.0'
        run: >-
          python -m pip install
          -c https://raw.githubusercontent.com/home-assistant/core/${{ matrix.home-assistant }}/homeassistant/package_constraints.txt
          "homeassistant==${{ matrix.home-assistant }}"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check generated blueprint is current
        run: python scripts/build_blueprint.py --check
      - name: Check generated dashboard cards are current
        run: python scripts/build_dashboard.py --check
      - name: Validate schema and behavior
        run: python -m pytest -q

  ha-beta:
    # Early warning: Managed Auto reads native ecobee/automation internals (adapter.py).
    # A failure here does not block the build; fix the adapter before that HA release.
    name: Home Assistant beta (early warning)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install newest Home Assistant pre-release
        run: python -m pip install --pre homeassistant
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate schema and behavior
        run: python -m pytest -q

  frontend:
    name: Frontend card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_bundle.py --check
      - run: python -m unittest discover -s tests/installer -v
