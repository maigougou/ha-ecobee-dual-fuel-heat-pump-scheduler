# Generated by scripts/build_blueprint.py; edit the builder or src/ sources.
blueprint:
  name: ecobee 双热源定时切换（中文版）
  description: 按时段在“正常制暖，允许辅助供暖”和“仅辅助供暖”之间切换。温度日程、舒适设置和参与控温的房间传感器仍由 ecobee 管理。需要 HA 原生 ecobee 集成及已正确配置的双热源系统。仅在制暖模式下运行；关闭、制冷和冷暖自动模式下不作调整。首次默认开启观察模式。停用自动化后，温控器保留最后的设置。云端通信可能延迟，无法保证准点切换或离线切换。版本
    0.2.0。 可选 Managed Auto 集成可使用同一日程调度自动冷暖。
  source_url: https://github.com/maigougou/ha-ecobee-dual-fuel-heat-pump-scheduler/blob/main/blueprints/automation/ecobee_dual_fuel_scheduler_zh.yaml
  domain: automation
  homeassistant:
    min_version: 2024.12.0
  input:
    equipment:
      name: 1 · 设备选择
      description: 使用 HA 原生 ecobee 集成，下方两个实体必须属于同一台温控器。
      input:
        thermostat:
          name: ecobee 温控器
          selector:
            entity:
              filter:
              - integration: ecobee
                domain: climate
        aux_switch:
          name: 仅辅助供暖开关
          description: 请选择名为 Auxiliary heat only 的开关，不要选择新风机或其他开关。辅助供暖应对应你希望使用的备用热源，例如燃气炉。
          selector:
            entity:
              filter:
              - integration: ecobee
                domain: switch
        managed_auto_entity:
          name: 自动冷暖控制器（可选）
          default: ''
          description: 选择可选 ecobee Managed Auto 集成的开关。控制器在自动冷暖模式使用本日程，接管同一温控器期间暂停此 Blueprint。仅制暖调度请留空。
          selector:
            entity:
              filter:
              - domain: switch
                integration: ecobee_managed_auto
    schedule:
      name: 2 · 热泵优先时段
      description: 时段内允许热泵供暖，允许 ecobee 按本机阈值调用辅助供暖；时段外使用仅辅助供暖。使用 HA 本地时间，星期指时段开始的日期。
      input:
        start_time:
          name: 开始时间
          default: '23:00:00'
          selector:
            time: {}
        end_time:
          name: 结束时间
          default: 07:00:00
          selector:
            time: {}
        weekdays:
          name: 开始日期（星期）
          default:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
          selector:
            select:
              multiple: true
              options:
              - label: 星期一
                value: mon
              - label: 星期二
                value: tue
              - label: 星期三
                value: wed
              - label: 星期四
                value: thu
              - label: 星期五
                value: fri
              - label: 星期六
                value: sat
              - label: 星期日
                value: sun
    protection:
      name: 3 · 压缩机最低室外温度（可选）
      description: 通常保持关闭，直接在温控器上设置设备保护阈值。启用前，请确认热泵允许的最低运行温度。此设置会保存在温控器上，停用自动化不会恢复原值。
      collapsed: true
      input:
        manage_cutoff:
          name: 由自动化管理压缩机最低室外温度
          default: false
          selector:
            boolean: {}
        cutoff_entity:
          name: 压缩机最低室外温度实体（可选）
          default: ''
          description: 仅在启用上方管理选项时需要。请选择同一台 ecobee 的 Compressor minimum temperature 数值实体。
          selector:
            entity:
              filter:
              - integration: ecobee
                domain: number
                device_class: temperature
        cutoff_f:
          name: 压缩机最低室外温度
          default: '15'
          description: ecobee 原生设置以 5°F 为步长；选项同时显示摄氏温度，写入时会自动换算为实体使用的单位。默认选项只是占位值，不是设备推荐值。请勿选择低于设备允许下限的温度。
          selector:
            select:
              options:
              - label: -25°F / -31.7°C
                value: '-25'
              - label: -20°F / -28.9°C
                value: '-20'
              - label: -15°F / -26.1°C
                value: '-15'
              - label: -10°F / -23.3°C
                value: '-10'
              - label: -5°F / -20.6°C
                value: '-5'
              - label: 0°F / -17.8°C
                value: '0'
              - label: 5°F / -15.0°C
                value: '5'
              - label: 10°F / -12.2°C
                value: '10'
              - label: 15°F / -9.4°C
                value: '15'
              - label: 20°F / -6.7°C
                value: '20'
              - label: 25°F / -3.9°C
                value: '25'
              - label: 30°F / -1.1°C
                value: '30'
              - label: 35°F / 1.7°C
                value: '35'
              - label: 40°F / 4.4°C
                value: '40'
              - label: 45°F / 7.2°C
                value: '45'
              - label: 50°F / 10.0°C
                value: '50'
              - label: 55°F / 12.8°C
                value: '55'
              - label: 60°F / 15.6°C
                value: '60'
              - label: 65°F / 18.3°C
                value: '65'
    operation:
      name: 4 · 运行与状态确认
      input:
        observation_mode:
          name: 观察模式（不控制设备）
          default: true
          description: 首次使用请保持开启。点击“运行动作”后，可在 HA 通知中查看计划使用的热源。确认所选实体、时段和温控器保护设置正确后，再关闭观察模式以启用控制。
          selector:
            boolean: {}
        acknowledgement_timeout:
          name: 每次操作的状态确认等待时间
          default: 240
          description: 云端状态刷新可能需要几分钟。等待超时不代表操作一定失败；再次尝试前会先检查当前状态。
          selector:
            number:
              min: 60
              max: 600
              step: 30
              unit_of_measurement: s
              mode: box
        max_attempts:
          name: 每轮中每项操作的最多尝试次数
          default: 2
          description: 本轮失败后，下次定时检查仍可能重试。此限制只针对当前这一轮，不限制所有轮次的累计尝试次数。
          selector:
            number:
              min: 1
              max: 3
              step: 1
              mode: box
        notify:
          name: 显示观察结果和异常通知
          default: true
          selector:
            boolean: {}
mode: single
max_exceeded: silent
triggers:
- trigger: time
  at: !input 'start_time'
- trigger: time
  at: !input 'end_time'
- trigger: time_pattern
  minutes: /5
- trigger: homeassistant
  event: start
- trigger: event
  event_type: automation_reloaded
variables:
  thermostat: !input 'thermostat'
  aux_switch: !input 'aux_switch'
  managed_auto_entity: !input 'managed_auto_entity'
  start_time: !input 'start_time'
  end_time: !input 'end_time'
  weekdays: !input 'weekdays'
  manage_cutoff: !input 'manage_cutoff'
  cutoff_entity: !input 'cutoff_entity'
  cutoff_f: !input 'cutoff_f'
  observation_mode: !input 'observation_mode'
  acknowledgement_timeout: !input 'acknowledgement_timeout'
  max_attempts: !input 'max_attempts'
  notify: !input 'notify'
  notification_id: '{{ ''ecobee_dual_fuel_'' ~ (this.entity_id | default(''manual'', true) | replace(''.'', ''_''))
    }}'
actions:
- variables:
    expected_policy: |
      {# Included at build time; the installed Blueprint has no external dependencies. #}
      {% macro policy() -%}
        {%- set t = states(thermostat) -%}
        {%- set a = states(aux_switch) -%}
        {%- set device = device_id(thermostat) -%}
        {%- set ecobee_entities = integration_entities('ecobee') -%}
        {%- set start = start_time.split(':') | map('int') | list -%}
        {%- set end = end_time.split(':') | map('int') | list -%}
        {%- set start_s = start[0] * 3600 + start[1] * 60 + (start[2] | default(0)) -%}
        {%- set end_s = end[0] * 3600 + end[1] * 60 + (end[2] | default(0)) -%}
        {%- set clock = now() -%}
        {%- set clock_s = clock.hour * 3600 + clock.minute * 60 + clock.second -%}
        {%- set names = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'] -%}
        {%- set today = clock.weekday() -%}
        {%- if not device or device_id(aux_switch) != device
            or thermostat not in ecobee_entities or aux_switch not in ecobee_entities -%}
          error:entities_must_share_one_native_ecobee_device
        {%- elif start_s == end_s or weekdays | length == 0
            or weekdays | reject('in', names) | list | length > 0 -%}
          error:invalid_schedule
        {%- elif t in ['unknown', 'unavailable'] or a not in ['on', 'off'] -%}
          error:required_entity_unavailable
        {%- elif managed_auto_entity and (states(managed_auto_entity) not in ['on', 'off']
            or state_attr(managed_auto_entity, 'thermostat') != thermostat
            or managed_auto_entity not in integration_entities('ecobee_managed_auto')) -%}
          error:auto_controller_unavailable_or_mismatched
        {%- elif managed_auto_entity and state_attr(managed_auto_entity, 'owns_mode') != false -%}
          skip:managed_auto_owns_mode
        {%- elif t != 'heat' -%}
          skip:not_in_heat_mode
        {%- elif manage_cutoff and cutoff_f | string not in
            ['-25', '-20', '-15', '-10', '-5', '0', '5', '10', '15', '20',
             '25', '30', '35', '40', '45', '50', '55', '60', '65'] -%}
          error:invalid_native_cutoff_step
        {%- elif manage_cutoff and (cutoff_entity not in ecobee_entities
            or device_id(cutoff_entity) != device
            or state_attr(cutoff_entity, 'device_class') != 'temperature'
            or state_attr(cutoff_entity, 'unit_of_measurement') not in ['°C', '°F']
            or not is_number(states(cutoff_entity))
            or not is_number(state_attr(cutoff_entity, 'min'))
            or not is_number(state_attr(cutoff_entity, 'max'))) -%}
          error:invalid_or_unavailable_cutoff_entity
        {%- elif manage_cutoff and (cutoff_value() | float < state_attr(cutoff_entity, 'min') | float
            or cutoff_value() | float > state_attr(cutoff_entity, 'max') | float) -%}
          error:cutoff_out_of_range
        {%- elif start_s < end_s -%}
          {{- 'heat' if start_s <= clock_s < end_s and names[today] in weekdays else 'aux' -}}
        {%- elif clock_s >= start_s -%}
          {{- 'heat' if names[today] in weekdays else 'aux' -}}
        {%- elif clock_s < end_s -%}
          {{- 'heat' if names[(today - 1) % 7] in weekdays else 'aux' -}}
        {%- else -%}
          aux
        {%- endif -%}
      {%- endmacro %}

      {% macro cutoff_value() -%}
        {{- (cutoff_f | float - 32) * 5 / 9
            if state_attr(cutoff_entity, 'unit_of_measurement') == '°C'
            else cutoff_f | float -}}
      {%- endmacro %}

      {% macro cutoff_matches() -%}
        {{- is_number(states(cutoff_entity))
            and (states(cutoff_entity) | float - cutoff_value() | float) | abs < 0.15 -}}
      {%- endmacro %}
      {{ policy() }}
- if:
  - condition: template
    value_template: '{{ expected_policy.startswith(''error:'') }}'
  then:
  - if:
    - condition: template
      value_template: '{{ notify }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: '{{ notification_id }}'
        title: ecobee 双热源定时切换（中文版）
        message: 配置或设备连接检查未通过：{{ expected_policy }}。未向设备发送控制指令。请确认所选实体可用，且属于原生 ecobee 集成中的同一台设备。
  - stop: 配置或设备连接检查未通过：{{ expected_policy }}。未向设备发送控制指令。请确认所选实体可用，且属于原生 ecobee 集成中的同一台设备。
- if:
  - condition: template
    value_template: '{{ expected_policy.startswith(''skip:'') }}'
  then:
  - action: persistent_notification.dismiss
    data:
      notification_id: '{{ notification_id }}'
  - stop: 当前不属于纯制暖调度，或自动冷暖控制器已接管。未向设备发送指令。
- if:
  - condition: template
    value_template: '{{ observation_mode }}'
  then:
  - if:
    - condition: template
      value_template: '{{ notify }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: '{{ notification_id }}'
        title: ecobee 双热源定时切换（中文版）
        message: 仅观察：当前时段应使用{{ '正常制暖，允许辅助供暖' if expected_policy == 'heat' else '仅辅助供暖' }}。仅辅助供暖开关当前{{ '开启' if is_state(aux_switch,
          'on') else '关闭' if is_state(aux_switch, 'off') else '状态未知' }}。压缩机最低室外温度管理{{ '已启用' if manage_cutoff else
          '未启用' }}。{% if manage_cutoff %}所选下限：{{ cutoff_f }}°F / {{ ((cutoff_f | float - 32) * 5 / 9) | round(1)
          }}°C；当前值：{{ states(cutoff_entity) }} {{ state_attr(cutoff_entity, 'unit_of_measurement') }}。仅在热泵优先时段内核对和调整这个下限。{%
          endif %}未向设备发送控制指令，温度日程和房间温度设置保持不变。
  - stop: 观察模式：未向设备发送控制指令。
- if:
  - condition: template
    value_template: '{{ expected_policy == ''heat'' and manage_cutoff }}'
  then:
  - repeat:
      count: '{{ max_attempts | int }}'
      sequence:
      - if:
        - condition: template
          value_template: |
            {# Included at build time; the installed Blueprint has no external dependencies. #}
            {% macro policy() -%}
              {%- set t = states(thermostat) -%}
              {%- set a = states(aux_switch) -%}
              {%- set device = device_id(thermostat) -%}
              {%- set ecobee_entities = integration_entities('ecobee') -%}
              {%- set start = start_time.split(':') | map('int') | list -%}
              {%- set end = end_time.split(':') | map('int') | list -%}
              {%- set start_s = start[0] * 3600 + start[1] * 60 + (start[2] | default(0)) -%}
              {%- set end_s = end[0] * 3600 + end[1] * 60 + (end[2] | default(0)) -%}
              {%- set clock = now() -%}
              {%- set clock_s = clock.hour * 3600 + clock.minute * 60 + clock.second -%}
              {%- set names = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'] -%}
              {%- set today = clock.weekday() -%}
              {%- if not device or device_id(aux_switch) != device
                  or thermostat not in ecobee_entities or aux_switch not in ecobee_entities -%}
                error:entities_must_share_one_native_ecobee_device
              {%- elif start_s == end_s or weekdays | length == 0
                  or weekdays | reject('in', names) | list | length > 0 -%}
                error:invalid_schedule
              {%- elif t in ['unknown', 'unavailable'] or a not in ['on', 'off'] -%}
                error:required_entity_unavailable
              {%- elif managed_auto_entity and (states(managed_auto_entity) not in ['on', 'off']
                  or state_attr(managed_auto_entity, 'thermostat') != thermostat
                  or managed_auto_entity not in integration_entities('ecobee_managed_auto')) -%}
                error:auto_controller_unavailable_or_mismatched
              {%- elif managed_auto_entity and state_attr(managed_auto_entity, 'owns_mode') != false -%}
                skip:managed_auto_owns_mode
              {%- elif t != 'heat' -%}
                skip:not_in_heat_mode
              {%- elif manage_cutoff and cutoff_f | string not in
                  ['-25', '-20', '-15', '-10', '-5', '0', '5', '10', '15', '20',
                   '25', '30', '35', '40', '45', '50', '55', '60', '65'] -%}
                error:invalid_native_cutoff_step
              {%- elif manage_cutoff and (cutoff_entity not in ecobee_entities
                  or device_id(cutoff_entity) != device
                  or state_attr(cutoff_entity, 'device_class') != 'temperature'
                  or state_attr(cutoff_entity, 'unit_of_measurement') not in ['°C', '°F']
                  or not is_number(states(cutoff_entity))
                  or not is_number(state_attr(cutoff_entity, 'min'))
                  or not is_number(state_attr(cutoff_entity, 'max'))) -%}
                error:invalid_or_unavailable_cutoff_entity
              {%- elif manage_cutoff and (cutoff_value() | float < state_attr(cutoff_entity, 'min') | float
                  or cutoff_value() | float > state_attr(cutoff_entity, 'max') | float) -%}
                error:cutoff_out_of_range
              {%- elif start_s < end_s -%}
                {{- 'heat' if start_s <= clock_s < end_s and names[today] in weekdays else 'aux' -}}
              {%- elif clock_s >= start_s -%}
                {{- 'heat' if names[today] in weekdays else 'aux' -}}
              {%- elif clock_s < end_s -%}
                {{- 'heat' if names[(today - 1) % 7] in weekdays else 'aux' -}}
              {%- else -%}
                aux
              {%- endif -%}
            {%- endmacro %}

            {% macro cutoff_value() -%}
              {{- (cutoff_f | float - 32) * 5 / 9
                  if state_attr(cutoff_entity, 'unit_of_measurement') == '°C'
                  else cutoff_f | float -}}
            {%- endmacro %}

            {% macro cutoff_matches() -%}
              {{- is_number(states(cutoff_entity))
                  and (states(cutoff_entity) | float - cutoff_value() | float) | abs < 0.15 -}}
            {%- endmacro %}
            {{ policy() != expected_policy }}
        then:
        - stop: 当前时段、温控器模式或设备连接状态发生变化。本轮操作已停止，下次运行将重新检查。
      - if:
        - condition: template
          value_template: |
            {# Included at build time; the installed Blueprint has no external dependencies. #}
            {% macro policy() -%}
              {%- set t = states(thermostat) -%}
              {%- set a = states(aux_switch) -%}
              {%- set device = device_id(thermostat) -%}
              {%- set ecobee_entities = integration_entities('ecobee') -%}
              {%- set start = start_time.split(':') | map('int') | list -%}
              {%- set end = end_time.split(':') | map('int') | list -%}
              {%- set start_s = start[0] * 3600 + start[1] * 60 + (start[2] | default(0)) -%}
              {%- set end_s = end[0] * 3600 + end[1] * 60 + (end[2] | default(0)) -%}
              {%- set clock = now() -%}
              {%- set clock_s = clock.hour * 3600 + clock.minute * 60 + clock.second -%}
              {%- set names = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'] -%}
              {%- set today = clock.weekday() -%}
              {%- if not device or device_id(aux_switch) != device
                  or thermostat not in ecobee_entities or aux_switch not in ecobee_entities -%}
                error:entities_must_share_one_native_ecobee_device
              {%- elif start_s == end_s or weekdays | length == 0
                  or weekdays | reject('in', names) | list | length > 0 -%}
                error:invalid_schedule
              {%- elif t in ['unknown', 'unavailable'] or a not in ['on', 'off'] -%}
                error:required_entity_unavailable
              {%- elif managed_auto_entity and (states(managed_auto_entity) not in ['on', 'off']
                  or state_attr(managed_auto_entity, 'thermostat') != thermostat
                  or managed_auto_entity not in integration_entities('ecobee_managed_auto')) -%}
                error:auto_controller_unavailable_or_mismatched
              {%- elif managed_auto_entity and state_attr(managed_auto_entity, 'owns_mode') != false -%}
                skip:managed_auto_owns_mode
              {%- elif t != 'heat' -%}
                skip:not_in_heat_mode
              {%- elif manage_cutoff and cutoff_f | string not in
                  ['-25', '-20', '-15', '-10', '-5', '0', '5', '10', '15', '20',
                   '25', '30', '35', '40', '45', '50', '55', '60', '65'] -%}
                error:invalid_native_cutoff_step
              {%- elif manage_cutoff and (cutoff_entity not in ecobee_entities
                  or device_id(cutoff_entity) != device
                  or state_attr(cutoff_entity, 'device_class') != 'temperature'
                  or state_attr(cutoff_entity, 'unit_of_measurement') not in ['°C', '°F']
                  or not is_number(states(cutoff_entity))
                  or not is_number(state_attr(cutoff_entity, 'min'))
                  or not is_number(state_attr(cutoff_entity, 'max'))) -%}
                error:invalid_or_unavailable_cutoff_entity
              {%- elif manage_cutoff and (cutoff_value() | float < state_attr(cutoff_entity, 'min') | float
                  or cutoff_value() | float > state_attr(cutoff_entity, 'max') | float) -%}
                error:cutoff_out_of_range
              {%- elif start_s < end_s -%}
                {{- 'heat' if start_s <= clock_s < end_s and names[today] in weekdays else 'aux' -}}
              {%- elif clock_s >= start_s -%}
                {{- 'heat' if names[today] in weekdays else 'aux' -}}
              {%- elif clock_s < end_s -%}
                {{- 'heat' if names[(today - 1) % 7] in weekdays else 'aux' -}}
              {%- else -%}
                aux
              {%- endif -%}
            {%- endmacro %}

            {% macro cutoff_value() -%}
              {{- (cutoff_f | float - 32) * 5 / 9
                  if state_attr(cutoff_entity, 'unit_of_measurement') == '°C'
                  else cutoff_f | float -}}
            {%- endmacro %}

            {% macro cutoff_matches() -%}
              {{- is_number(states(cutoff_entity))
                  and (states(cutoff_entity) | float - cutoff_value() | float) | abs < 0.15 -}}
            {%- endmacro %}
            {{ not (cutoff_matches() | bool) }}
        then:
        - action: number.set_value
          continue_on_error: true
          target:
            entity_id: '{{ cutoff_entity }}'
          data:
            value: |
              {# Included at build time; the installed Blueprint has no external dependencies. #}
              {% macro policy() -%}
                {%- set t = states(thermostat) -%}
                {%- set a = states(aux_switch) -%}
