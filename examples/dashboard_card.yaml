# Generated by scripts/build_dashboard.py. Native cards only; no custom frontend.
# Replace example entities in both entity_id and content, plus the automation control row.
type: vertical-stack
cards:
- type: markdown
  entity_id:
  - climate.example_ecobee
  - switch.example_ecobee_auxiliary_heat_only
  - automation.example_ecobee_dual_fuel
  content: |
    {# Edit entity IDs here and in this card's entity_id list. #}
    {%- set climate = 'climate.example_ecobee' -%}
    {%- set aux = 'switch.example_ecobee_auxiliary_heat_only' -%}
    {%- set automation = 'automation.example_ecobee_dual_fuel' -%}
    {%- set temperature_unit = '°C' -%}
    {%- set cutoff_entity = '' -%}

    {%- set mode = states(climate) -%}
    {%- set available = mode not in ['unknown', 'unavailable'] -%}
    {%- set raw = state_attr(climate, 'equipment_running') -%}
    {%- set reported = available and raw is string -%}
    {%- set signals = raw.split(',') | map('trim') | reject('equalto', '') | list if reported else [] -%}
    {%- set heat_codes = ['heatPump', 'heatPump2', 'heatPump3'] -%}
    {%- set cool_codes = ['compCool1', 'compCool2'] -%}
    {%- set aux_codes = ['auxHeat1', 'auxHeat2', 'auxHeat3'] -%}
    {%- set fan_codes = ['fan', 'ventilator', 'economizer'] -%}
    {%- set known = heat_codes + cool_codes + aux_codes + fan_codes + ['humidifier', 'dehumidifier', 'compHotWater', 'auxHotWater', 'compWaterHeater'] -%}
    {%- set unknown_codes = signals | reject('in', known) | list -%}
    {%- set heat_active = signals | select('in', heat_codes) | list -%}
    {%- set cool_active = signals | select('in', cool_codes) | list -%}
    {%- set aux_active = signals | select('in', aux_codes) | list -%}
    {%- set fan_report = state_attr(climate, 'fan') -%}
    {%- set comfort = state_attr(climate, 'preset_mode') -%}
    {%- set comfort_label = {'home': '在家', 'away': '离家', 'sleep': '睡眠'}.get(comfort | lower, comfort) if available and comfort else '暂无数据' -%}
    {%- set current = state_attr(climate, 'current_temperature') -%}
    {%- set target = state_attr(climate, 'temperature') -%}
    {%- macro temperature(value) -%}
    {{- (value | round(1)) ~ ' ' ~ temperature_unit if available and value is number else '—' -}}
    {%- endmacro -%}
    {%- macro stage(codes) -%}
    {%- set result = namespace(stage=0) -%}
    {%- for code in codes -%}{%- if code in signals -%}{%- set result.stage = loop.index -%}{%- endif -%}{%- endfor -%}
    {{- '' ~ result.stage ~ ' 级' if result.stage else '状态未知' -}}
    {%- endmacro -%}
    {%- macro outdoor_status() -%}
    {%- if not reported -%}状态未知
    {%- elif heat_active or cool_active -%}
    {%- if heat_active -%}制暖 · {{ stage(heat_codes) }}{%- endif -%}
    {%- if heat_active and cool_active %}<br>{% endif -%}
    {%- if cool_active -%}制冷 · {{ stage(cool_codes) }}{%- endif -%}
    {%- elif unknown_codes -%}状态未知
    {%- else -%}未运行{%- endif -%}
    {%- endmacro -%}
    {%- macro furnace_status() -%}
    {%- if not reported -%}状态未知
    {%- elif aux_active -%}制暖 · {{ stage(aux_codes) }}
    {%- elif unknown_codes -%}状态未知
    {%- else -%}未运行{%- endif -%}
    {%- endmacro -%}
    {%- macro blower_status() -%}
    {%- if not available -%}状态未知
    {%- elif fan_report == 'on' or (fan_report != 'off' and reported and 'fan' in signals) -%}运行中
    {%- elif aux_active and (fan_report == 'off' or (reported and not unknown_codes)) -%}由炉子控制
    {%- elif fan_report == 'off' -%}未运行
    {%- elif not reported or unknown_codes -%}状态未知
    {%- else -%}未运行{%- endif -%}
    {%- endmacro -%}

    <table role="presentation" width="100%">
    <tr><td><small>当前室温</small><h1>{{ temperature(current) }}</h1></td><td align="right"><strong>{{ comfort_label | e }}</strong><br><small>目标 {% if mode == 'heat_cool' %}{{ temperature(state_attr(climate, 'target_temp_low')) }} – {{ temperature(state_attr(climate, 'target_temp_high')) }}{% else %}{{ temperature(target) }}{% endif %}</small></td></tr>
    </table>
    <p><ha-icon icon="{% if mode == 'cool' %}mdi:snowflake{% elif mode == 'off' %}mdi:power{% else %}mdi:heat-pump-outline{% endif %}"></ha-icon> {% if not available %}状态未知{% elif mode == 'heat' and is_state(aux, 'on') %}仅炉子供暖{% elif mode == 'heat' and is_state(aux, 'off') %}热泵 · 炉子备用{% elif mode == 'heat' %}制暖 · 热源状态未知{% elif mode == 'cool' %}制冷模式{% elif mode == 'heat_cool' %}自动冷暖 · 定时切换暂停{% elif mode == 'off' %}已关闭{% else %}{{ mode | e }}{% endif %}</p>
    {% if not reported %}<p><small>状态未知</small></p>{% elif unknown_codes %}<p><small>状态待确认</small></p>{% elif not heat_active and not cool_active and not aux_active %}<p><small>{% if fan_report == 'on' %}送风／通风{% elif not signals %}待机{% elif signals | select('in', fan_codes) | list %}送风／通风{% else %}其他设备运行{% endif %}</small></p>{% endif %}
    <hr>
    <table role="presentation" width="100%">
    <tr><td width="50%"><ha-icon icon="mdi:heat-pump-outline"></ha-icon> <strong>热泵</strong><p>{{ outdoor_status() }}</p></td><td width="50%"><ha-icon icon="mdi:fire"></ha-icon> <strong>炉子／送风机</strong><p>{% if aux_active %}{{ furnace_status() }}{% else %}制暖: {{ furnace_status() }}{% endif %}<br>送风机: {{ blower_status() }}</p></td></tr>
    </table>

    {% if is_state(automation, 'off') %}<ha-alert alert-type="info">自动调度已停用，保留最后的热源设置。</ha-alert>{% elif not is_state(automation, 'on') %}<ha-alert alert-type="warning">自动调度状态未知</ha-alert>{% endif %}
    <details><summary>更多信息</summary>
    <p><small>{% if is_state(automation, 'on') %}自动调度已启用{% elif is_state(automation, 'off') %}自动调度已停用，保留最后的热源设置。{% else %}自动调度状态未知{% endif %}</small></p>
    {% if cutoff_entity %}<p><small>压缩机最低室外温度: {{ states(cutoff_entity) if is_number(states(cutoff_entity)) else '暂无数据' }} {{ state_attr(cutoff_entity, 'unit_of_measurement') or '' }}</small></p>{% endif %}
    <p><small>ecobee 状态: {{ (raw if signals else '待机') | e if reported else '状态未知' }}</small></p>
    <p><small>运行状态和级数来自 ecobee，云端更新可能延迟；不由功率推算。送风机读取 Fan 运行状态，不使用风扇模式设置；新风机状态另行报告。待机、送风时仍可能耗电。</small></p>

    <p><small>室温为 ecobee 当前用于控温的温度，可能由多个房间传感器组合。 开关只表示自动化是否启用；观察模式、时段和执行结果请查看配置及运行记录。</small></p>
    </details>
- type: entities
  show_header_toggle: false
  entities:
  - entity: automation.example_ecobee_dual_fuel
    name: 自动调度
    icon: mdi:calendar-clock
    tap_action:
      action: more-info
  - type: button
    name: 时段与设置
    icon: mdi:tune-variant
    action_name: 打开
    tap_action:
      action: navigate
      navigation_path: /config/automation
