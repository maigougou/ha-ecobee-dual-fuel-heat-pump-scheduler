# Generated by scripts/build_dashboard.py. Native cards only; no custom frontend.
# Replace example entities in both entity_id and content, plus the automation control row.
# Optional power: use W/kW entities from any brand; set an unused entity to ''.
type: vertical-stack
cards:
- type: markdown
  entity_id:
  - climate.example_ecobee
  - switch.example_ecobee_auxiliary_heat_only
  - automation.example_ecobee_dual_fuel
  - sensor.example_heat_pump_power
  - sensor.example_furnace_power
  content: |
    {# Edit entity IDs here and in this card's entity_id list. #}
    {%- set climate = 'climate.example_ecobee' -%}
    {%- set aux = 'switch.example_ecobee_auxiliary_heat_only' -%}
    {%- set automation = 'automation.example_ecobee_dual_fuel' -%}
    {%- set temperature_unit = '°C' -%}
    {%- set cutoff_entity = '' -%}
    {%- set heat_pump_power_entity = 'sensor.example_heat_pump_power' -%}
    {%- set furnace_power_entity = 'sensor.example_furnace_power' -%}
    {%- set power_note = '' -%}
    {%- set mode = states(climate) -%}
    {%- set available = mode not in ['unknown', 'unavailable'] -%}
    {%- set raw = state_attr(climate, 'equipment_running') -%}
    {%- set reported = available and raw is string -%}
    {%- set signals = raw.split(',') | map('trim') | reject('equalto', '') | list if reported else [] -%}
    {%- set heat_codes = ['heatPump', 'heatPump2', 'heatPump3'] -%}
    {%- set cool_codes = ['compCool1', 'compCool2'] -%}
    {%- set aux_codes = ['auxHeat1', 'auxHeat2', 'auxHeat3'] -%}
    {%- set fan_codes = ['fan', 'ventilator', 'economizer'] -%}
    {%- set known = heat_codes + cool_codes + aux_codes + fan_codes + ['humidifier', 'dehumidifier', 'compHotWater', 'auxHotWater', 'compWaterHeater'] -%}
    {%- set unknown_codes = signals | reject('in', known) | list -%}
    {%- set heat_active = signals | select('in', heat_codes) | list -%}
    {%- set cool_active = signals | select('in', cool_codes) | list -%}
    {%- set aux_active = signals | select('in', aux_codes) | list -%}
    {%- set fan_report = state_attr(climate, 'fan') -%}
    {%- set comfort = state_attr(climate, 'preset_mode') -%}
    {%- set comfort_label = {'home': 'Home', 'away': 'Away', 'sleep': 'Sleep'}.get(comfort | lower, comfort) if available and comfort else 'No data' -%}
    {%- set current = state_attr(climate, 'current_temperature') -%}
    {%- set target = state_attr(climate, 'temperature') -%}
    {%- macro temperature(value) -%}
    {{- (value | round(1)) ~ ' ' ~ temperature_unit if available and value is number else '—' -}}
    {%- endmacro -%}
    {%- macro stage(codes) -%}
    {%- set result = namespace(stage=0) -%}
    {%- for code in codes -%}{%- if code in signals -%}{%- set result.stage = loop.index -%}{%- endif -%}{%- endfor -%}
    {{- 'Stage ' ~ result.stage ~ '' if result.stage else 'Unknown' -}}
    {%- endmacro -%}
    {%- macro outdoor_status() -%}
    {%- if not reported -%}Unknown
    {%- elif heat_active or cool_active -%}
    {%- if heat_active -%}Heating · {{ stage(heat_codes) }}{%- endif -%}
    {%- if heat_active and cool_active %}<br>{% endif -%}
    {%- if cool_active -%}Cooling · {{ stage(cool_codes) }}{%- endif -%}
    {%- elif unknown_codes -%}Unknown
    {%- else -%}Not running{%- endif -%}
    {%- endmacro -%}
    {%- macro furnace_status() -%}
    {%- if not reported -%}Unknown
    {%- elif aux_active -%}Heating · {{ stage(aux_codes) }}
    {%- elif unknown_codes -%}Unknown
    {%- else -%}Not running{%- endif -%}
    {%- endmacro -%}
    {%- macro blower_status() -%}
    {%- if not available -%}Unknown
    {%- elif fan_report == 'on' or (fan_report != 'off' and reported and 'fan' in signals) -%}Running
    {%- elif aux_active and (fan_report == 'off' or (reported and not unknown_codes)) -%}Controlled by furnace
    {%- elif fan_report == 'off' -%}Not running
    {%- elif not reported or unknown_codes -%}Unknown
    {%- else -%}Not running{%- endif -%}
    {%- endmacro -%}
    {%- macro power(entity) -%}
    {%- if entity -%}
    {%- set value = states(entity) -%}
    {%- set unit = state_attr(entity, 'unit_of_measurement') -%}
    {%- if not is_number(value) -%}<p><small>Power unavailable</small></p>
    {%- elif unit not in ['W', 'kW'] -%}<p><small>Use a W / kW power sensor</small></p>
    {%- else -%}<h2>{{ value | float | round(3 if unit == 'kW' else 1) }} <small>{{ unit }}</small></h2>
    {%- endif -%}
    {%- endif -%}
    {%- endmacro -%}

    <table role="presentation" width="100%">
    <tr><td><small>Indoor temperature</small><h1>{{ temperature(current) }}</h1></td><td align="right"><strong>{{ comfort_label | e }}</strong><br><small>Target {% if mode == 'heat_cool' %}{{ temperature(state_attr(climate, 'target_temp_low')) }} – {{ temperature(state_attr(climate, 'target_temp_high')) }}{% else %}{{ temperature(target) }}{% endif %}</small></td></tr>
    </table>
    <p><ha-icon icon="{% if mode == 'cool' %}mdi:snowflake{% elif mode == 'off' %}mdi:power{% else %}mdi:heat-pump-outline{% endif %}"></ha-icon> {% if not available %}Unknown{% elif mode == 'heat' and is_state(aux, 'on') %}Furnace only{% elif mode == 'heat' and is_state(aux, 'off') %}Heat pump · Furnace backup{% elif mode == 'heat' %}Heating · Source unknown{% elif mode == 'cool' %}Cooling mode{% elif mode == 'heat_cool' %}Heat / Cool · Source schedule paused{% elif mode == 'off' %}Off{% else %}{{ mode | e }}{% endif %}</p>
    {% if not reported %}<p><small>Unknown</small></p>{% elif unknown_codes %}<p><small>Check equipment status</small></p>{% elif not heat_active and not cool_active and not aux_active %}<p><small>{% if fan_report == 'on' %}Fan / ventilation{% elif not signals %}Idle{% elif signals | select('in', fan_codes) | list %}Fan / ventilation{% else %}Other equipment active{% endif %}</small></p>{% endif %}
    <hr>
    <table role="presentation" width="100%">
    <tr><td width="50%"><ha-icon icon="mdi:heat-pump-outline"></ha-icon> <strong>Heat pump</strong><p>{{ outdoor_status() }}</p>{{ power(heat_pump_power_entity) }}</td><td width="50%"><ha-icon icon="mdi:fire"></ha-icon> <strong>Furnace / blower</strong><p>{% if aux_active %}{{ furnace_status() }}{% else %}Heating: {{ furnace_status() }}{% endif %}<br>Blower: {{ blower_status() }}</p>{{ power(furnace_power_entity) }}</td></tr>
    </table>
    {% if power_note and (heat_pump_power_entity or furnace_power_entity) %}<p><small>{{ power_note | e }}</small></p>{% endif %}
    {% if is_state(automation, 'off') %}<ha-alert alert-type="info">Source schedule disabled; last source settings remain.</ha-alert>{% elif not is_state(automation, 'on') %}<ha-alert alert-type="warning">Schedule state unknown</ha-alert>{% endif %}
    <details><summary>Details</summary>
    <p><small>{% if is_state(automation, 'on') %}Source schedule enabled{% elif is_state(automation, 'off') %}Source schedule disabled; last source settings remain.{% else %}Schedule state unknown{% endif %}</small></p>
    {% if cutoff_entity %}<p><small>Minimum compressor outdoor temperature: {{ states(cutoff_entity) if is_number(states(cutoff_entity)) else 'No data' }} {{ state_attr(cutoff_entity, 'unit_of_measurement') or '' }}</small></p>{% endif %}
    <p><small>ecobee status: {{ (raw if signals else 'Idle') | e if reported else 'Unknown' }}</small></p>
    <p><small>Equipment status and stages come from ecobee and may be delayed. They are never inferred from power. Blower status uses the Fan operating report, not fan mode; ventilation is reported separately. Idle equipment and fans can still use electricity.</small></p>
    <p><small>Power is electrical input, not heat output or gas use. Heat-pump heating and cooling share one reading.</small></p>
    <p><small>Indoor temperature is the temperature ecobee uses for control; it may combine several room sensors. The toggle only indicates whether the automation is enabled. Check configuration and traces for observation mode, times and results.</small></p>
    </details>
- type: entities
  show_header_toggle: false
  entities:
  - entity: automation.example_ecobee_dual_fuel
    name: Schedule
    icon: mdi:calendar-clock
    tap_action:
      action: more-info
  - type: button
    name: Schedule settings
    icon: mdi:tune-variant
    action_name: Open
    tap_action:
      action: navigate
      navigation_path: /config/automation
